[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-agent"
version = "0.1.0"
description = "Starter: an agent with a genuinely separate session vs. persistent memory, proven with a two-session demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
memory-agent = "memory_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_agent"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
