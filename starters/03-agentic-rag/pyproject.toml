[project]
name = "agentic-rag"
version = "0.1.0"
description = "An agent that decides whether and how to retrieve, with a visible plan-then-act loop and a machine-readable decision trace."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agentic-rag = "agentic_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
